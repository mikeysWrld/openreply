name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  validate:
    name: Merge and validate upstream/main
    if: github.repository == 'mikeysWrld/openreply'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      base_sha: ${{ steps.merge.outputs.base_sha }}
      upstream_sha: ${{ steps.merge.outputs.upstream_sha }}
      tree_sha: ${{ steps.merge.outputs.tree_sha }}

    steps:
      - name: Checkout fork base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream while preserving fork automation
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="$(git rev-parse HEAD)"

          git remote add upstream https://github.com/diwenne/openreply.git
          git fetch --no-tags upstream main
          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$UPSTREAM_SHA" "$BASE_SHA"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-ff --no-commit "$UPSTREAM_SHA"
          merge_status=$?
          set -e

          if (( merge_status != 0 )); then
            conflict_found=false
            unprotected_conflict=false
            while IFS= read -r -d '' path; do
              conflict_found=true
              case "$path" in
                .github/workflows|.github/workflows/*|.github/actions|.github/actions/*)
                  ;;
                *)
                  echo "::error::Upstream merge conflict requires manual resolution"
                  printf 'Conflicting path: %q\n' "$path" >&2
                  unprotected_conflict=true
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U -z)

            if [[ "$conflict_found" != true || "$unprotected_conflict" == true ]]; then
              exit "$merge_status"
            fi
          fi

          for path in .github/workflows .github/actions; do
            git rm -r -f --ignore-unmatch -- "$path"
            if git cat-file -e "${BASE_SHA}:${path}" 2>/dev/null; then
              git restore --source="$BASE_SHA" --staged --worktree -- "$path"
            fi
          done

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved merge conflicts remain"
            exit 1
          fi

          git -c core.hooksPath=/dev/null commit --no-edit
          MERGED_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse "${MERGED_SHA}^1")" = "$BASE_SHA"
          test "$(git rev-parse "${MERGED_SHA}^2")" = "$UPSTREAM_SHA"

          object_id() {
            if git cat-file -e "${1}:${2}" 2>/dev/null; then
              git rev-parse "${1}:${2}"
            else
              printf '%s\n' absent
            fi
          }

          for path in .github/workflows .github/actions; do
            test "$(object_id "$BASE_SHA" "$path")" = "$(object_id "$MERGED_SHA" "$path")"
          done

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git rev-parse "${MERGED_SHA}^{tree}")" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: npm ci

      - name: Generate Prisma client
        if: steps.merge.outputs.changed == 'true'
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/instrareply

      - name: Lint
        if: steps.merge.outputs.changed == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.merge.outputs.changed == 'true'
        run: npm run typecheck

      - name: Run tests
        if: steps.merge.outputs.changed == 'true'
        run: npm test

      - name: Build
        if: steps.merge.outputs.changed == 'true'
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/instrareply
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-ci-build
          CRON_SECRET: test-secret-for-ci-cron
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          RESEND_API_KEY: re_test
          EMAIL_FROM: "InstaReply <login@example.com>"
          META_GRAPH_API_VERSION: v25.0
          INSTAGRAM_APP_ID: test
          INSTAGRAM_APP_SECRET: test
          FACEBOOK_APP_SECRET: test
          WEBHOOK_VERIFY_TOKEN: test

      - name: Verify validated tree is unchanged
        if: steps.merge.outputs.changed == 'true'
        env:
          VALIDATED_TREE: ${{ steps.merge.outputs.tree_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{tree}')" = "$VALIDATED_TREE"
          git diff --quiet
          git diff --cached --quiet

  write:
    name: Reproduce and push validated merge
    needs: validate
    if: >-
      github.repository == 'mikeysWrld/openreply' &&
      needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout verified fork base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce validated merge
        id: merge
        shell: bash
        env:
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          UPSTREAM_SHA: ${{ needs.validate.outputs.upstream_sha }}
          VALIDATED_TREE: ${{ needs.validate.outputs.tree_sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$BASE_SHA"

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

          git remote add upstream https://github.com/diwenne/openreply.git
          git fetch --no-tags upstream main
          git cat-file -e "${UPSTREAM_SHA}^{commit}"
          git merge-base --is-ancestor "$UPSTREAM_SHA" FETCH_HEAD

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-ff --no-commit "$UPSTREAM_SHA"
          merge_status=$?
          set -e

          if (( merge_status != 0 )); then
            conflict_found=false
            unprotected_conflict=false
            while IFS= read -r -d '' path; do
              conflict_found=true
              case "$path" in
                .github/workflows|.github/workflows/*|.github/actions|.github/actions/*)
                  ;;
                *)
                  echo "::error::Upstream merge conflict requires manual resolution"
                  printf 'Conflicting path: %q\n' "$path" >&2
                  unprotected_conflict=true
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U -z)

            if [[ "$conflict_found" != true || "$unprotected_conflict" == true ]]; then
              exit "$merge_status"
            fi
          fi

          for path in .github/workflows .github/actions; do
            git rm -r -f --ignore-unmatch -- "$path"
            if git cat-file -e "${BASE_SHA}:${path}" 2>/dev/null; then
              git restore --source="$BASE_SHA" --staged --worktree -- "$path"
            fi
          done

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved merge conflicts remain"
            exit 1
          fi

          git -c core.hooksPath=/dev/null commit --no-edit
          MERGED_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse "${MERGED_SHA}^1")" = "$BASE_SHA"
          test "$(git rev-parse "${MERGED_SHA}^2")" = "$UPSTREAM_SHA"

          object_id() {
            if git cat-file -e "${1}:${2}" 2>/dev/null; then
              git rev-parse "${1}:${2}"
            else
              printf '%s\n' absent
            fi
          }

          for path in .github/workflows .github/actions; do
            test "$(object_id "$BASE_SHA" "$path")" = "$(object_id "$MERGED_SHA" "$path")"
          done

          test "$(git rev-parse "${MERGED_SHA}^{tree}")" = "$VALIDATED_TREE"
          git diff --quiet
          git diff --cached --quiet
          echo "merge_sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"

      - name: Push exact validated tree
        shell: bash
        env:
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"

          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git \
            -c core.hooksPath=/dev/null \
            -c credential.helper= \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "${MERGE_SHA}:refs/heads/main"
